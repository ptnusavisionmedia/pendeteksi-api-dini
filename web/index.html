<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deteksi Kebakaran Dini</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #6b7280; --line: #e3e6ea;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #181c22; --text: #e8eaed; --muted: #9aa3af; --line: #2a3038; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .conn { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }

  .status { border-radius: 14px; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
            background: var(--card); border: 2px solid var(--line); margin-bottom: 16px; }
  .status.normal { border-color: var(--ok); }
  .status.waspada { border-color: var(--warn); }
  .status.bahaya { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card)); }
  .status .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .status .value { font-size: 28px; font-weight: 700; text-transform: uppercase; }
  .status.normal .value { color: var(--ok); } .status.waspada .value { color: var(--warn); } .status.bahaya .value { color: var(--bad); }
  .meta { display: flex; gap: 24px; flex-wrap: wrap; }
  .meta b { display: block; font-size: 16px; }
  button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .card .label { font-size: 13px; color: var(--muted); }
  .card .num { font-size: 32px; font-weight: 700; margin: 2px 0 8px; }
  .card .num small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .4s, background .4s; }

  section.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
  section.panel h2 { font-size: 15px; margin: 0 0 10px; }
  .chartbox { position: relative; height: 280px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .empty { color: var(--muted); padding: 12px 0; }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔥 Deteksi Kebakaran Dini</h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">menghubungkan…</span></div>
  </header>

  <div class="status" id="statusBox">
    <div>
      <div class="label">Status</div>
      <div class="value" id="statusVal">menunggu data</div>
    </div>
    <div class="meta">
      <div><span class="label">Buzzer</span><b id="buzzer">-</b></div>
      <div><span class="label">Data terakhir</span><b id="lastSeen">-</b></div>
    </div>
    <button id="btnReset" disabled>Reset Alarm</button>
  </div>

  <div class="grid">
    <div class="card"><div class="label">Suhu</div><div class="num"><span id="vTemp">-</span><small>°C</small></div><div class="bar"><i id="bTemp"></i></div></div>
    <div class="card"><div class="label">Kelembapan</div><div class="num"><span id="vHum">-</span><small>%</small></div><div class="bar"><i id="bHum"></i></div></div>
    <div class="card"><div class="label">Asap (sensor gas)</div><div class="num"><span id="vSmoke">-</span><small>%</small></div><div class="bar"><i id="bSmoke"></i></div></div>
    <div class="card"><div class="label">Api (LDR)</div><div class="num"><span id="vFlame">-</span><small>%</small></div><div class="bar"><i id="bFlame"></i></div></div>
  </div>

  <section class="panel">
    <h2>Tren sensor</h2>
    <div class="chartbox"><canvas id="chart"></canvas></div>
    <div class="note" id="histNote"></div>
  </section>

  <section class="panel">
    <h2>Riwayat alert</h2>
    <div id="alertBox"><div class="empty">Memuat…</div></div>
  </section>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const C = window.APP_CONFIG;
  const $ = id => document.getElementById(id);
  const MAX_POINTS = 60;

  // ---------- Chart ----------
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const chart = new Chart($('chart'), {
    type: 'line',
    data: { labels: [], datasets: [
      { label: 'Suhu (°C)', data: [], borderColor: '#2563eb', tension: .3, pointRadius: 0 },
      { label: 'Asap (%)',  data: [], borderColor: '#d97706', tension: .3, pointRadius: 0 },
      { label: 'Api (%)',   data: [], borderColor: '#dc2626', tension: .3, pointRadius: 0 },
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      scales: { y: { min: 0, max: 100, grid: { color: css('--line') }, ticks: { color: css('--muted') } },
                x: { grid: { display: false }, ticks: { color: css('--muted'), maxTicksLimit: 8 } } },
      plugins: { legend: { labels: { color: css('--text') } } },
    },
  });

  function pushPoint(label, t, s, f) {
    const d = chart.data;
    d.labels.push(label);
    d.datasets[0].data.push(t); d.datasets[1].data.push(s); d.datasets[2].data.push(f);
    if (d.labels.length > MAX_POINTS) { d.labels.shift(); d.datasets.forEach(x => x.data.shift()); }
    chart.update('none');
  }
  const fmtTime = iso => new Date(iso).toLocaleTimeString('id-ID', { hour12: false });

  // ---------- Kartu sensor ----------
  function level(v, [lo, hi]) { return v > hi ? 'var(--bad)' : v > lo ? 'var(--warn)' : 'var(--ok)'; }
  function setCard(key, val, range, max) {
    const num = $('v' + key), bar = $('b' + key);
    if (val == null) { num.textContent = '-'; bar.style.width = '0'; return; }
    num.textContent = Number(val).toFixed(key === 'Temp' || key === 'Hum' ? 1 : 0);
    bar.style.width = Math.min(100, Math.max(0, val / max * 100)) + '%';
    bar.style.background = range ? level(val, range) : 'var(--accent)';
  }
  function setStatus(s, buzzer) {
    const box = $('statusBox');
    box.className = 'status ' + (s || '');
    $('statusVal').textContent = s || 'menunggu data';
    if (buzzer !== undefined) $('buzzer').textContent = buzzer ? 'ON' : 'OFF';
  }

  // ---------- MQTT (WebSocket langsung ke broker) ----------
  const T = k => C.TOPIC_BASE + k;
  const client = mqtt.connect(C.MQTT_URL, {
    clientId: 'web-' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000, connectTimeout: 8000,
  });
  const setConn = (on, txt) => { $('dot').classList.toggle('on', on); $('connText').textContent = txt; $('btnReset').disabled = !on; };

  client.on('connect', () => {
    setConn(true, 'terhubung ke broker');
    client.subscribe([T('telemetry'), T('status')]);
  });
  client.on('reconnect', () => setConn(false, 'menyambung ulang…'));
  client.on('offline', () => setConn(false, 'terputus'));
  client.on('error', e => setConn(false, 'error: ' + e.message));

  client.on('message', (topic, buf) => {
    let p; try { p = JSON.parse(buf.toString()); } catch { return; }
    if (topic === T('telemetry')) {
      setCard('Temp', p.temperature, C.TH.temp, 100);
      setCard('Hum', p.humidity, null, 100);
      setCard('Smoke', p.smoke, C.TH.smoke, 100);
      setCard('Flame', p.flame, C.TH.flame, 100);
      setStatus(p.status, p.alarm);
      $('lastSeen').textContent = new Date().toLocaleTimeString('id-ID', { hour12: false });
      pushPoint(new Date().toLocaleTimeString('id-ID', { hour12: false }), p.temperature ?? null, p.smoke ?? null, p.flame ?? null);
    } else if (topic === T('status')) {
      if (p.status === 'offline') { setStatus('', undefined); $('statusVal').textContent = 'perangkat offline'; return; }
      setStatus(p.status, p.buzzer);
      if (p.status === 'bahaya') loadAlerts();
    }
  });

  $('btnReset').addEventListener('click', () => {
    client.publish(T('command'), 'reset');
    $('btnReset').textContent = 'Terkirim ✓';
    setTimeout(() => ($('btnReset').textContent = 'Reset Alarm'), 1500);
  });

  // ---------- Supabase (REST, hanya baca) ----------
  async function sb(path) {
    const r = await fetch(C.SUPABASE_URL + '/rest/v1/' + path, {
      headers: { apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY },
    });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  async function loadHistory() {
    try {
      const rows = (await sb('readings?select=created_at,temperature,smoke,flame&order=created_at.desc&limit=40')).reverse();
      rows.forEach(r => pushPoint(fmtTime(r.created_at), r.temperature, r.smoke, r.flame));
      $('histNote').textContent = rows.length ? `Termasuk ${rows.length} titik riwayat dari database.` : 'Belum ada riwayat di database.';
    } catch (e) { $('histNote').textContent = 'Riwayat database tidak dapat dimuat (cek config.js dan RLS).'; }
  }

  async function loadAlerts() {
    try {
      const rows = await sb('alerts?select=created_at,temperature,smoke,flame,status,telegram_ok&order=created_at.desc&limit=10');
      if (!rows.length) { $('alertBox').innerHTML = '<div class="empty">Belum ada alert.</div>'; return; }
      $('alertBox').innerHTML = '<table><thead><tr><th>Waktu</th><th>Suhu</th><th>Asap</th><th>Api</th><th>Status</th><th>Telegram</th></tr></thead><tbody>' +
        rows.map(r => `<tr><td>${new Date(r.created_at).toLocaleString('id-ID', { hour12: false })}</td><td>${r.temperature ?? '-'}°C</td><td>${r.smoke ?? '-'}%</td><td>${r.flame ?? '-'}%</td><td>${r.status}</td><td>${r.telegram_ok ? 'terkirim' : 'gagal'}</td></tr>`).join('') +
        '</tbody></table>';
    } catch (e) { $('alertBox').innerHTML = '<div class="empty">Riwayat alert tidak dapat dimuat.</div>'; }
  }

  loadHistory().then(loadAlerts);
  setInterval(loadAlerts, 30000);
})();
</script>
</body>
</html>
